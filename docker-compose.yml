# EdgeGate production packaging. MongoDB is hosted by MongoDB Atlas; Redis
# remains private to this Docker network. Only the frontend publishes port 80.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - appnet
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      CONTROL_PLANE_PORT: 5010
      AUTH_PORT: 5011
      ENTRY_LB_PORT: 3010
      GATEWAY_PORTS: "3011,3012,3013"
      BACKEND_INSTANCES: "4011:users,4014:users,4012:products,4015:products,4013:orders,4016:orders"
      MONGO_URI: ${DOCKER_MONGO_URI:?DOCKER_MONGO_URI must be set to the authenticated MongoDB Atlas URI}
      REDIS_URL: ${DOCKER_REDIS_URL:?DOCKER_REDIS_URL must be set to an authenticated URL using redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for Docker production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set for Docker production}
      HEALTH_CHECK_INTERVAL: 3000
      PROXY_TIMEOUT: 8000
    depends_on:
      redis:
        condition: service_started
    expose:
      - "3010"
      - "3011"
      - "3012"
      - "3013"
      - "4011"
      - "4012"
      - "4013"
      - "4014"
      - "4015"
      - "4016"
      - "5010"
      - "5011"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - appnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for Docker production}
    command:
      - sh
      - -c
      - 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes'
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  redis_data:

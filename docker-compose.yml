# EdgeGate local infrastructure.
#
# MongoDB runs as a SINGLE-NODE REPLICA SET (rs0). That is the smallest change
# that enables multi-document ACID transactions, which the Order Service
# (P1.4) requires: all stock deductions + order creation commit atomically, so
# a failed order never leaves partial inventory changes. A plain standalone
# mongod CANNOT run transactions, so do not remove --replSet.
#
# The replica set self-initializes: the healthcheck runs rs.initiate() on the
# first start if the set does not exist yet. This file is the local-development
# setup; published database ports are loopback-only. Production credentials
# can be supplied through the ignored local environment file. Do not enable
# credentials against an existing unauthenticated mongo_data volume without
# first provisioning the MongoDB users.
#
# NOTE for existing installations: if you created `mongo_data` while MongoDB
# ran standalone, run `docker compose up -d` after this change - the healthcheck
# will initiate the replica set automatically (data is preserved).
services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--port", "27018", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$MONGO_INITDB_ROOT_USERNAME" ] && [ -n "$$MONGO_INITDB_ROOT_PASSWORD" ]; then
            mongosh --quiet --port 27018 --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval
            "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27018'}]}).ok }";
          else
            mongosh --quiet --port 27018 --eval
            "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27018'}]}).ok }";
          fi
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  mongo_data:
